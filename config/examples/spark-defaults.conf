#
# Spark Configuration
# File: spark-defaults.conf
# Location: $SPARK_HOME/conf/
#
# This file contains Spark application default configurations.
# These settings apply to all Spark applications unless overridden.
#

# ============================================
# Master Configuration
# ============================================

# Use YARN as the cluster manager
spark.master                     yarn

# ============================================
# Event Logging (for History Server)
# ============================================

# Enable event logging
spark.eventLog.enabled           true

# Directory where Spark stores event logs (must exist in HDFS)
spark.eventLog.dir               hdfs://m-1:9000/spark-logs

# Compress event logs to save space
spark.eventLog.compress          true

# ============================================
# History Server Configuration
# ============================================

# Directory where History Server reads logs from
spark.history.fs.logDirectory    hdfs://m-1:9000/spark-logs

# History Server address (for YARN to link to)
spark.yarn.historyServer.address m-1:18080

# History Server web UI port
spark.history.ui.port            18080

# Number of applications to retain in History Server
spark.history.fs.update.interval 10s
spark.history.retainedApplications 50

# ============================================
# Driver Configuration (Client Mode)
# ============================================

# Driver memory
spark.driver.memory              512m

# Driver CPU cores
spark.driver.cores               1

# Driver memory overhead for YARN
spark.yarn.driver.memoryOverhead 128m

# ============================================
# Executor Configuration
# ============================================

# Memory per executor
# For 4GB VM: 512m
# For 8GB VM: 1g
spark.executor.memory            512m

# CPU cores per executor
spark.executor.cores             1

# Number of executors (static allocation)
# For 2-node cluster: 2
spark.executor.instances         2

# Memory overhead for executor containers
spark.yarn.executor.memoryOverhead 128m

# ============================================
# Dynamic Allocation (Optional)
# ============================================

# Enable dynamic allocation to auto-scale executors
# Disable if you want static allocation
spark.dynamicAllocation.enabled  false

# Minimum executors
spark.dynamicAllocation.minExecutors 1

# Maximum executors
spark.dynamicAllocation.maxExecutors 2

# Initial executors
spark.dynamicAllocation.initialExecutors 1

# ============================================
# Memory Management
# ============================================

# Fraction of heap space used for execution and storage
# Default: 0.6 (60% of heap)
spark.memory.fraction            0.6

# Fraction of spark.memory.fraction used for storage
# Default: 0.5 (50% of execution/storage memory for storage)
spark.memory.storageFraction     0.5

# ============================================
# Serialization
# ============================================

# Use Kryo serialization (faster than Java serialization)
spark.serializer                 org.apache.spark.serializer.KryoSerializer

# Kryo buffer max size
spark.kryoserializer.buffer.max  64m

# ============================================
# Shuffle Configuration
# ============================================

# Compress shuffle output
spark.shuffle.compress           true

# Compress spilled data during shuffle
spark.shuffle.spill.compress     true

# Shuffle service for YARN
spark.shuffle.service.enabled    true

# ============================================
# Network Configuration
# ============================================

# Network timeout
spark.network.timeout            300s

# RPC ask timeout
spark.rpc.askTimeout             300s

# RPC lookup timeout
spark.rpc.lookupTimeout          120s

# ============================================
# Locality Configuration
# ============================================

# How long to wait for data locality
# Lower values = less data locality but faster scheduling
spark.locality.wait              3s

# ============================================
# Spark SQL Configuration
# ============================================

# Enable adaptive query execution
spark.sql.adaptive.enabled       true

# Coalesce shuffle partitions
spark.sql.adaptive.coalescePartitions.enabled true

# Shuffle partitions
spark.sql.shuffle.partitions     200

# ============================================
# UI Configuration
# ============================================

# Keep UI alive for 7 days after app finishes
spark.ui.retainedJobs            1000
spark.ui.retainedStages          1000

# ============================================
# Python Configuration (for PySpark)
# ============================================

# Python executable path
spark.pyspark.python             /usr/bin/python3

# Python driver executable
spark.pyspark.driver.python      /usr/bin/python3

# ============================================
# Application Configuration
# ============================================

# Default application name (can be overridden)
# spark.app.name                 MySparkApp

# ============================================
# Logging Configuration
# ============================================

# Log level (ALL, DEBUG, INFO, WARN, ERROR, FATAL, OFF)
# spark.driver.extraJavaOptions  -Dlog4j.configuration=file:///path/to/log4j.properties

# ============================================
# Advanced Configuration (Optional)
# ============================================

# Broadcast threshold (objects larger than this are broadcast)
spark.broadcast.blockSize        4m

# Maximum result size (total size of serialized results)
spark.driver.maxResultSize       1g

# Compression codec for internal data
spark.io.compression.codec       snappy

# ============================================
# Notes:
# ============================================
#
# 1. Memory Settings for 4GB VMs:
#    - spark.driver.memory: 512m
#    - spark.executor.memory: 512m
#    - spark.executor.instances: 1-2
#
# 2. Memory Settings for 8GB VMs:
#    - spark.driver.memory: 1g
#    - spark.executor.memory: 1g
#    - spark.executor.instances: 2
#
# 3. To override these settings for a specific application:
#    spark-submit --conf spark.executor.memory=1g ...
#
# 4. Create the event log directory in HDFS:
#    hdfs dfs -mkdir -p /spark-logs
#    hdfs dfs -chmod 777 /spark-logs
#
# 5. For more configuration options, see:
#    https://spark.apache.org/docs/3.3.2/configuration.html
